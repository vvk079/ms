# render.yaml — one-click deploy for the RICHBAYY Express API on Render.
# Create a new "Blueprint" on Render pointing at this repo. Set the secret env
# vars (MONGO_URI, JWT_SECRET, IMAGEKIT_*) in the Render dashboard.
services:
  - type: web
    name: richbayy-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        sync: false        # e.g. https://richbayy.vercel.app
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 30d
      - key: COOKIE_NAME
        value: richbayy_token

      # Firebase Phone Auth — the customer sign-in path. Without ONE of these
      # (or SMS_PROVIDER below) the server refuses to boot in production, since
      # nobody would be able to sign in. Paste from the service-account JSON:
      # Firebase console → Project settings → Service accounts.
      - key: FIREBASE_PROJECT_ID
        sync: false        # e.g. richbayy-97465
      - key: FIREBASE_CLIENT_EMAIL
        sync: false        # firebase-adminsdk-xxx@<project>.iam.gserviceaccount.com
      - key: FIREBASE_PRIVATE_KEY
        sync: false        # paste the whole key INCLUDING the \n escapes

      # Fallback SMS gateway — only needed if you're not using Firebase.
      - key: SMS_PROVIDER
        sync: false

      # Leave false until a real payment gateway is verified (COD only).
      - key: PAYMENTS_ENABLED
        value: false
      - key: IMAGEKIT_PUBLIC_KEY
        sync: false
      - key: IMAGEKIT_PRIVATE_KEY
        sync: false
      - key: IMAGEKIT_URL_ENDPOINT
        sync: false
